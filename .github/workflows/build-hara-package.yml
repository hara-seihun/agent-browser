name: Build Hara download repair package

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-linux-x64:
    # Converge runs glibc 2.36. Keep the published executable compatible with
    # both fleet hosts instead of inheriting ubuntu-latest's newer libc.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
      - name: Build native executable
        run: cargo build --release --manifest-path cli/Cargo.toml
      - name: Pack executable with the npm package
        run: |
          install -m 755 cli/target/release/agent-browser bin/agent-browser-linux-x64
          npm pack --ignore-scripts
          sha256sum agent-browser-0.37.1.tgz > agent-browser-0.37.1.tgz.sha256
      - name: Publish immutable package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create download-browser-scope-784d655-glibc235 \
            agent-browser-0.37.1.tgz \
            agent-browser-0.37.1.tgz.sha256 \
            --target "$GITHUB_SHA" \
            --title "Download browser-scope repair 784d655 for glibc 2.35" \
            --notes "Linux x64 agent-browser 0.37.1 package built on Ubuntu 22.04 for glibc 2.35 compatibility. Source repair commit: 784d655. Upstream pull request: https://github.com/vercel-labs/agent-browser/pull/1858"
