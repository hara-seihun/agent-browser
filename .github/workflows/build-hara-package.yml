name: Build Hara native browser package

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable release tag for this source commit
        required: true
        type: string

permissions:
  contents: write

jobs:
  sensitive-input-tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
      - name: Build native executable
        run: cargo build --release --manifest-path cli/Cargo.toml
      - name: Install real Chrome and browser dependencies
        run: cli/target/release/agent-browser install --with-deps
      - name: Full native unit suite and sensitive form input e2e
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-receipts
          cargo test --release --manifest-path cli/Cargo.toml -- --list | tee test-receipts/test-list.log
          grep -Eq 'e2e_sensitive[^:]*: test' test-receipts/test-list.log
          cargo test --release --manifest-path cli/Cargo.toml -- --test-threads=1 2>&1 | tee test-receipts/unit.log
          cargo test --release --manifest-path cli/Cargo.toml e2e_sensitive -- --ignored --test-threads=1 2>&1 | tee test-receipts/sensitive-e2e.log
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - name: Install pinned real React temporal fixture dependencies
        run: pnpm install --filter agent-browser --frozen-lockfile --ignore-scripts
      - name: Retained controlled temporal input and frame custody coverage
        shell: bash
        run: |
          set -euo pipefail
          {
            cargo test --release --manifest-path cli/Cargo.toml e2e_eval_runs_inside_the_active_frame -- --ignored --test-threads=1
            cargo test --release --manifest-path cli/Cargo.toml e2e_console_includes_cross_origin_frame_logs -- --ignored --test-threads=1
            cargo test --release --manifest-path cli/Cargo.toml e2e_attach_preserves_existing_cross_origin_frames -- --ignored --test-threads=1
            cargo test --release --manifest-path cli/Cargo.toml e2e_fill_controlled_temporal_inputs -- --ignored --test-threads=1
            cargo test --release --manifest-path cli/Cargo.toml e2e_tab_state -- --ignored --test-threads=1
          } 2>&1 | tee test-receipts/retained-frame-date-e2e.log
      - name: Preserve durable test receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sensitive-input-test-receipts
          path: test-receipts/
          if-no-files-found: warn

  package-linux-x64:
    needs: sensitive-input-tests
    # Converge runs glibc 2.36. Keep the published executable compatible with
    # both fleet hosts instead of inheriting ubuntu-latest's newer libc.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
      - name: Build native executable
        run: cargo build --release --manifest-path cli/Cargo.toml
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - name: Pack executable with the npm package
        run: |
          install -m 755 cli/target/release/agent-browser bin/agent-browser-linux-x64
          pnpm pack
          sha256sum agent-browser-0.37.1.tgz > agent-browser-0.37.1.tgz.sha256
      - name: Publish immutable package
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          test -n "$RELEASE_TAG"
          gh release create "$RELEASE_TAG" \
            agent-browser-0.37.1.tgz \
            agent-browser-0.37.1.tgz.sha256 \
            --target "$GITHUB_SHA" \
            --title "Retained temporal fill and authorized clean-tab restoration for glibc 2.35" \
            --notes "Linux x64 agent-browser 0.37.1 package built on Ubuntu 22.04 for both fleet hosts. Native snapshots and getters redact protected payment, password and one-time-code fields without changing live values. cc-name stays public. Coverage includes shadow DOM and cross-origin out-of-process iframes. Eval, screenshot/PDF, downloads and browser-data output are guarded on current or remembered sensitive tabs. Continuous recording/trace/profiler/HAR/stream and addinitscript always fail closed with SENSITIVE_OUTPUT_UNSUPPORTED; no bypass flag. Session metadata never probes CDP; in-flight lifecycle requests return daemon_busy without cancelling the owning operation. Restore save and owned browser close requests are bounded, and external CDP browsers are detached without Browser.close. Publication requires the full unit suite and real Chrome sensitive input e2e suite, with durable test logs. Temporal fill routes check retained values after rendering and reject application resets with typed errors. Explicit expiring owner/account/origin-bound clean-tab capsules restore sessionStorage before app startup without replaying context-wide cookies. Publication additionally requires real React temporal-route and clean-tab replacement/new-tab isolation regressions. Retains prior frame custody repairs. Packaged source commit: $GITHUB_SHA."
