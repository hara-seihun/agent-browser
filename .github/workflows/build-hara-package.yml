name: Build Hara browser repairs package

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-linux-x64:
    # Converge runs glibc 2.36. Keep the published executable compatible with
    # both fleet hosts instead of inheriting ubuntu-latest's newer libc.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
      - name: Build native executable
        run: cargo build --release --manifest-path cli/Cargo.toml
      - name: Check controlled date inputs and frame custody with real Chrome
        run: |
          cargo test --release --manifest-path cli/Cargo.toml e2e_eval_runs_inside_the_active_frame -- --ignored
          cargo test --release --manifest-path cli/Cargo.toml e2e_console_includes_cross_origin_frame_logs -- --ignored
          cargo test --release --manifest-path cli/Cargo.toml e2e_attach_preserves_existing_cross_origin_frames -- --ignored
          cargo test --release --manifest-path cli/Cargo.toml e2e_fill_controlled_temporal_inputs -- --ignored
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - name: Pack executable with the npm package
        run: |
          install -m 755 cli/target/release/agent-browser bin/agent-browser-linux-x64
          pnpm pack
          sha256sum agent-browser-0.37.1.tgz > agent-browser-0.37.1.tgz.sha256
      - name: Publish immutable package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create browser-controlled-dates-20261003-glibc235 \
            agent-browser-0.37.1.tgz \
            agent-browser-0.37.1.tgz.sha256 \
            --target "$GITHUB_SHA" \
            --title "Controlled date input repairs for glibc 2.35" \
            --notes "Linux x64 agent-browser 0.37.1 package built on Ubuntu 22.04 for both fleet hosts. Temporal input fill uses the native value setter plus input/change events to update controlled state and verifies the retained value. Invalid and read-only temporal inputs fail instead of reporting false success. Real Chrome e2e covers date/datetime-local fill, clearing, value tracking and rejection. Retains all prior frame, download-scope and screenshot repairs. Packaged source commit: $GITHUB_SHA."
