name: Build Hara browser repairs package

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-linux-x64:
    # Converge runs glibc 2.36. Keep the published executable compatible with
    # both fleet hosts instead of inheriting ubuntu-latest's newer libc.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
      - name: Build native executable
        run: cargo build --release --manifest-path cli/Cargo.toml
      - name: Check selected-frame evaluation and console with real Chrome
        run: |
          cargo test --release --manifest-path cli/Cargo.toml e2e_eval_runs_inside_the_active_frame -- --ignored
          cargo test --release --manifest-path cli/Cargo.toml e2e_console_includes_cross_origin_frame_logs -- --ignored
      - name: Pack executable with the npm package
        run: |
          install -m 755 cli/target/release/agent-browser bin/agent-browser-linux-x64
          npm pack --ignore-scripts
          sha256sum agent-browser-0.37.1.tgz > agent-browser-0.37.1.tgz.sha256
      - name: Publish immutable package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create browser-frames-20260930-glibc235 \
            agent-browser-0.37.1.tgz \
            agent-browser-0.37.1.tgz.sha256 \
            --target "$GITHUB_SHA" \
            --title "Cross-origin frame repairs for glibc 2.35" \
            --notes "Linux x64 agent-browser 0.37.1 package built on Ubuntu 22.04 for both fleet hosts. Cross-origin CSS frame lookup, selected-frame eval and iframe console fixes derived from upstream PR https://github.com/vercel-labs/agent-browser/pull/1697 (85c8900, c4cabb4; upstream author retained). Retains download-scope PR 1858 and screenshot target-wake PR 1189 repairs. Packaged source commit: $GITHUB_SHA."
